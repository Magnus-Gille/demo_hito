[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadfinder-demo"
version = "0.1.0"
description = "Local lead finder demo for recruitment sales prospecting"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "requests>=2.32.3,<3",
]

[project.scripts]
leadfinder = "leadfinder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

